version: "3.8"

services:
  langgraph-workflows:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: langgraph-workflows
    ports:
      - "8004:8004"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  workflow_data: